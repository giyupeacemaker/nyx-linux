#
# Nyx Linux — Arch-based Calamares ISO
#
# Keep CachyOS last: official Arch packages always take priority.
#
[options]
HoldPkg = pacman glibc
Architecture = x86_64
ParallelDownloads = 5
# CheckSpace is deliberately NOT enabled here.
#
# It makes pacman verify free space by calling statfs() on the package cache.
# When pacman installs into a fresh root, as mkarchiso does with --sysroot, that
# path is resolved inside the root it is creating, which does not exist in the
# host's namespace yet. The call fails, pacman reads the available space as zero
# and aborts the whole transaction with:
#
#   error: could not determine cachedir mount point .../var/cache/pacman/pkg
#   error: failed to commit transaction (not enough free disk space)
#
# on a machine with 931 GB free. The live image installs 786 packages this way,
# so it cannot be enabled for this file.
#
# What is lost is an early warning when /boot is too small. pacman still fails
# loudly with a real ENOSPC in that case, and a wrong answer is worse than no
# answer: this setting reported zero bytes on a nearly empty disk.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Only packages unavailable in official Arch repositories are taken from here
# (linux-cachyos, ckbcomp, yay/paru, and other CachyOS-specific helpers).
#
# SigLevel is Optional TrustAll here, and this is the one place it must stay that
# way. The reason: this file is also the pacman.conf of the build host and of the
# live image, and build.sh drops the CachyOS keyring files into the image without
# ever importing them into the build host's own keyring. Requiring signatures here
# would break the build itself.
#
# The installed system does not inherit that weakness. nyx-prepare-keyring imports
# the CachyOS key during installation and then rewrites this section to
# "Required DatabaseRequired", because all 830 packages in the CachyOS database
# are signed by a single key which it verifies is present and trusted first.
#
# What this level is protecting against, and why it cannot be dropped blindly:
# pacman validates against the local keyring in /etc/pacman.d/gnupg, and an
# unknown key there does not get rejected, it gets a question:
#   :: Import PGP key 882DCFE4...F3B607488DB35A47? [Y/n]
# with no answer available during installation, which ends the install with
# "failed to synchronize all databases".
[cachyos]
SigLevel = Optional TrustAll
Server = https://mirror.cachyos.org/repo/$arch/cachyos

# Nyx's own package, holding the helper tools: nyx-updates, nyx-rollback and
# the first-run setup. Two different paths end up here:
#
#   installed system   /var/cache/nyx-repo, seeded at install time and appended
#                      to afterwards by nyx-update-git
#   live image         rewritten by build.sh to the build-time local repository
#
# SigLevel is Optional TrustAll because this is a local directory of packages
# this machine produced, signed with a key that only exists on it. The Arch
# repositories above keep the strict "Required DatabaseOptional" level.
[nyx]
SigLevel = Optional TrustAll
Server = file:///var/cache/nyx-repo
