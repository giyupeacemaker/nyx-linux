---
modules-search: [ local ]

instances:
  - id: desktop
    module: packagechooser
    config: packagechooser-desktop.conf
  - id: aurhelper
    module: packagechooser
    config: packagechooser-aurhelper.conf
  - id: bootloader
    module: packagechooser
    config: packagechooser-bootloader.conf
  - id: initramfs
    module: shellprocess
    config: shellprocess-initramfs.conf
    weight: 30
  - id: bootloader-config
    module: shellprocess
    config: shellprocess-bootloader.conf
    weight: 30

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@desktop
      - packagechooser@aurhelper
      - packagechooser@bootloader
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      # unpackfs comes before everything that enters the target. It is what
      # actually populates the root directory; until it has run the target is an
      # empty mount point, and any chroot into it fails.
      #
      # machineid used to sit above unpackfs, and it runs
      # "chroot <target> ln -sf /etc/machine-id /var/lib/dbus/machine-id".
      # With an empty target there is no /usr/bin/ln to run, chroot exits 127
      # with "failed to run command 'ln': No such file or directory", and the
      # installation dies there. The binary is present in both images, which is
      # why this looks like a missing file and is not.
      - unpackfs
      - machineid
      # packages runs before users on purpose. It installs nyx-tools, which
      # carries etc/skel/.config/autostart/nyx-wallpaper.desktop, and users
      # copies /etc/skel into the new home directory. With users first the home
      # is made before that file exists in the skeleton, and the first-login
      # wallpaper silently never applies: no error, just nothing happening.
      - packages
      - users
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - shellprocess@initramfs
      - displaymanager
      - services-systemd
      - grubcfg
      - shellprocess@bootloader-config
      - umount
  - show:
      - finished

branding: archlinux
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
