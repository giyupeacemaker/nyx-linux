---
modules-search: [ local ]

instances:
  - id: desktop
    module: packagechooser
    config: packagechooser-desktop.conf
  - id: aurhelper
    module: packagechooser
    config: packagechooser-aurhelper.conf
  - id: extras
    module: packagechooser
    config: packagechooser-extras.conf
  - id: bootloader
    module: packagechooser
    config: packagechooser-bootloader.conf
  - id: initramfs
    module: shellprocess
    config: shellprocess-initramfs.conf
    weight: 30
  - id: keyring
    module: shellprocess
    config: shellprocess-keyring.conf
    weight: 20
  - id: bootloader-config
    module: shellprocess
    config: shellprocess-bootloader.conf
    weight: 30

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@desktop
      - packagechooser@aurhelper
      - packagechooser@extras
      - packagechooser@bootloader
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      # unpackfs comes before everything that enters the target. It is what
      # actually populates the root directory; until it has run the target is an
      # empty mount point, and any chroot into it fails.
      #
      # machineid used to sit above unpackfs, and it runs
      # "chroot <target> ln -sf /etc/machine-id /var/lib/dbus/machine-id".
      # With an empty target there is no /usr/bin/ln to run, chroot exits 127
      # with "failed to run command 'ln': No such file or directory", and the
      # installation dies there. The binary is present in both images, which is
      # why this looks like a missing file and is not.
      - unpackfs
      - machineid
      # shellprocess@keyring must run before packages. There are two defects it
      # has to fix, not one, and the second is the one that actually ended every
      # installation.
      #
      # First, pacstrap installs archlinux-keyring into the target but never
      # runs pacman-key --populate there, so the target ends up with 183 keys
      # and none of them trusted. /etc/pacman.conf asks core and extra for
      # SigLevel = Required DatabaseOptional, both databases are signed, and a
      # signature nothing can verify is one pacman has to refuse. The identical
      # command in the live session succeeds because there the keyring sits on
      # a writable tmpfs and populates itself on first use.
      #
      # Second, the CachyOS keyring ships in the target as a file and nothing
      # imports it, so pacman reached the signed cachyos database, did not know
      # the key, and asked about it interactively with no --noconfirm in reach.
      # Populating only archlinux leaves that untouched, which is how this was
      # misdiagnosed for a day as being about the untrusted Arch keys.
      #
      # It runs after unpackfs because it writes into the target, and before
      # packages because packages is what needs the keys.
      - shellprocess@keyring
      # packages runs before users on purpose. It installs nyx-tools, which
      # carries etc/skel/.config/autostart/nyx-wallpaper.desktop, and users
      # copies /etc/skel into the new home directory. With users first the home
      # is made before that file exists in the skeleton, and the first-login
      # wallpaper silently never applies: no error, just nothing happening.
      - packages
      - users
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - shellprocess@initramfs
      - displaymanager
      # Calamares' own displaymanager module left the display manager disabled on
      # the tested image: after a completed installation sddm was "disabled;
      # preset: disabled" with an empty journal, so it had never run and the
      # system booted to a text console. The install log was not kept, so the
      # module's reason could not be read either. This step does not depend on
      # that module having done its job: it looks for the systemd unit files
      # themselves and enables whichever manager the chosen desktop actually
      # installed. A manager that is not installed has no unit file, so this
      # cannot be wrong in the way a remembered setting can.
      #
      # It has to run after displaymanager and after packages, since the unit
      # files only exist once the desktop's packages are in place.
      - shellprocess@displaymanager
      - services-systemd
      - grubcfg
      - shellprocess@bootloader-config
      # umount is deliberately NOT in this list. It used to be, and that is why
      # the installed system had no /var/log/Calamares.log: the target was
      # unmounted at the end of the exec phase, and the finished module, which
      # runs afterwards to write that log, had nothing left to write into.
      #
      # Keeping the target mounted until the installer quits is what Calamares
      # expects, and it unmounts on its own when it exits. Unmounting early buys
      # nothing here and costs the one record of what the installation actually
      # did, which is the first thing anyone wants when a finished install turns
      # out to be broken.
  - show:
      - finished

branding: archlinux
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
