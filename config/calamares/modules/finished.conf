---
# copyInstallationLog is stated rather than left to the default, because the
# installed system is only worth having a record of if that record is actually
# written. It needs the target still mounted when this module runs, which is why
# the umount module is out of the exec sequence in settings.conf.
copyInstallationLog: true
restartNowMode: user-unchecked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: false
