---
backend: pacman
skip_if_no_internet: false
update_db: true
update_system: true
ignore_update_db_error: false

pacman:
    num_retries: 2
    disable_download_timeout: true
    needed_only: true

operations:
  - install:
      - base
      - linux-cachyos
      - linux-cachyos-headers
      - linux-firmware
      - mkinitcpio
      - efibootmgr
      - fastfetch
      - sudo
      - git
      - wget
      - curl
      - base-devel
      - networkmanager
      - iwd
      - network-manager-applet
      - xdg-user-dirs
      - xdg-utils
      - xdg-desktop-portal
      - reflector
      # checkupdates for nyx-updates; it syncs into a throwaway database
      # instead of touching the system one.
      - pacman-contrib
      - zram-generator
      - bash-completion
      - man-db
      - man-pages
      - nano
      - vim
      - which
      - htop
      - lsof
      - jq
      - file
      - pciutils
      - usbutils
      - smartmontools
      - nvme-cli
      - lm_sensors
      - alsa-utils
      - pavucontrol
      - bluez
      - bluez-utils
      - cups
      - cups-filters
      - udisks2
      - cryptsetup
      - lvm2
      - btrfs-progs
      # Snapshot backends for nyx-rollback. snapper covers btrfs, timeshift
      # covers ext4 and the other filesystems without snapshot support, which
      # is what the installer picks by default.
      - snapper
      - timeshift
      - e2fsprogs
      - dosfstools
      - xfsprogs
      - mtools
      - grub
      - limine
      - os-prober
      - openssh
      - noto-fonts
      - noto-fonts-extra
      - noto-fonts-cjk
      - noto-fonts-emoji
      - ttf-dejavu
      - ttf-liberation
      - amd-ucode
      - intel-ucode
      - zstd
