---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true
  - name: "NetworkManager-wait-online.service"
    action: "enable"
    mandatory: true
  - name: "systemd-resolved.service"
    action: "enable"
    mandatory: true
  - name: "iwd.service"
    action: "enable"
    mandatory: true
  - name: "bluetooth.service"
    action: "enable"
    mandatory: false
  - name: "cups.service"
    action: "enable"
    mandatory: false
  - name: "systemd-networkd.service"
    action: "disable"
    mandatory: false
  - name: "systemd-networkd.socket"
    action: "disable"
    mandatory: false
