---
dontChroot: false
timeout: 1800
verbose: true

i18n:
  name: "Building the initramfs"
  name[ru]: "Создание initramfs"

script:
  # Restore the systemd-resolved stub first so the target never keeps the
  # temporary public resolvers, even if mkinitcpio fails afterwards.
  - command: >-
      rm -f /etc/resolv.conf &&
      ln -s /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
    timeout: 30
    verbose: true
  - command: "mkinitcpio -P"
    timeout: 1800
    verbose: true
