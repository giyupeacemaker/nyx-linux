---
# Optional extras, ticked rather than chosen one of. The desktop chooser above
# and the AUR helper chooser are method: packages, which is exclusive: you pick
# one item. This one is method: optional, so any combination can be ticked, and
# default is empty, because installing something nobody asked for is the one
# thing an installer must not do.
#
# Every package here was checked to exist in the Arch core and extra
# repositories before being written down. An unverified name does not fail
# quietly: it takes the packages step down with it, on the user's machine and
# not in the build log, which is exactly how a list like this becomes a mystery.
# Four candidates were dropped for not existing: telegram and youtube-dl are
# gone from Arch, network-manager-openvpn is packaged as networkmanager-openvpn,
# and one more was my own typo.
#
# podman rather than docker, for a reason worth stating: docker needs a
# background daemon and a privileged group to be useful, podman does not and
# runs rootless, which is what a freshly installed desktop should hand over.
method: optional
default: []

labels:
  step: "Optional software"
  step[ru]: "Дополнительные программы"

items:
  - id: browser
    name: "Firefox"
    name[ru]: "Firefox"
    description: "Web browser."
    description[ru]: "Веб-браузер."
    screenshot: "/etc/calamares/branding/archlinux/extras-browser.svg"
    packages: [ firefox ]

  - id: office
    name: "LibreOffice"
    name[ru]: "LibreOffice"
    description: "Word processor, spreadsheets and presentations."
    description[ru]: "Текстовый редактор, таблицы и презентации."
    screenshot: "/etc/calamares/branding/archlinux/extras-office.svg"
    packages: [ libreoffice-fresh ]

  - id: images
    name: "Image editing"
    name[ru]: "Работа с изображениями"
    description: "GIMP, Inkscape and Krita: raster drawing, vector drawing and painting."
    description[ru]: "GIMP, Inkscape и Krita: растровая графика, векторная графика и painting."
    screenshot: "/etc/calamares/branding/archlinux/extras-images.svg"
    packages: [ gimp, inkscape, krita ]

  - id: video
    name: "Video and streaming"
    name[ru]: "Видео и трансляции"
    description: "OBS Studio, Blender, FFmpeg and HandBrake."
    description[ru]: "OBS Studio, Blender, FFmpeg и HandBrake."
    screenshot: "/etc/calamares/branding/archlinux/extras-video.svg"
    packages: [ obs-studio, blender, ffmpeg, handbrake ]

  - id: media
    name: "Media players"
    name[ru]: "Медиаплееры"
    description: "mpv and VLC."
    description[ru]: "mpv и VLC."
    screenshot: "/etc/calamares/branding/archlinux/extras-media.svg"
    packages: [ mpv, vlc ]

  - id: downloads
    name: "Downloads"
    name[ru]: "Загрузки"
    description: "qBittorrent and yt-dlp."
    description[ru]: "qBittorrent и yt-dlp."
    screenshot: "/etc/calamares/branding/archlinux/extras-downloads.svg"
    packages: [ qbittorrent, yt-dlp ]

  - id: passwords
    name: "Password manager"
    name[ru]: "Менеджер паролей"
    description: "KeePassXC, with a local encrypted database."
    description[ru]: "KeePassXC, с локальной зашифрованной базой."
    screenshot: "/etc/calamares/branding/archlinux/extras-passwords.svg"
    packages: [ keepassxc ]

  - id: containers
    name: "Podman"
    name[ru]: "Podman"
    description: "Containers without a background daemon, running rootless."
    description[ru]: "Контейнеры без фонового демона, с запуском от пользователя."
    screenshot: "/etc/calamares/branding/archlinux/extras-containers.svg"
    packages: [ podman ]

  - id: virtualmachines
    name: "Virtual machines"
    name[ru]: "Виртуальные машины"
    description: "virt-manager, with QEMU."
    description[ru]: "virt-manager, вместе с QEMU."
    screenshot: "/etc/calamares/branding/archlinux/extras-virtualmachines.svg"
    packages: [ virt-manager ]

  - id: vpn
    name: "WireGuard"
    name[ru]: "WireGuard"
    description: "WireGuard tools and the NetworkManager client."
    description[ru]: "Утилиты WireGuard и клиент NetworkManager."
    screenshot: "/etc/calamares/branding/archlinux/extras-vpn.svg"
