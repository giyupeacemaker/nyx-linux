    name[ru]: "Клиент Nextcloud"
    description: "Syncs files with a Nextcloud server."
    description[ru]: "Синхронизирует файлы с сервером Nextcloud."
    screenshot: "/etc/calamares/branding/archlinux/extras-cloud.svg"
    packages: [ nextcloud-client ]

  - id: messaging
    name: "Messaging"
    name[ru]: "Обмен сообщениями"
    description: "Signal and Discord."
    description[ru]: "Signal и Discord."
    screenshot: "/etc/calamares/branding/archlinux/extras-messaging.svg"
