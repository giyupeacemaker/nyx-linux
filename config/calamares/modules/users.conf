---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false

  # No password quality rules. A single character is accepted, because this is a
  # personal image and the length floor was the only thing between the user and
  # the password they wanted.
  #
  # Four separate switches had to move, and leaving any one of them on keeps the
  # restriction alive:
  #   minLength             the QML field refuses to submit anything shorter
  #   libpwquality minlen   the quality check rejects it
  #   libpwquality minclass required two character classes, which a one character
  #                         password cannot satisfy by definition
  #   allowWeakPasswords    the master switch that permits a password failing the
  #                         checks above
# No password quality rules. A single character is accepted, because this is a
# personal image and the length floor was the only thing between the user and
# the password they wanted.
#
# Four separate switches had to move, and leaving any one of them on keeps the
# restriction alive:
#   minLength             the QML field refuses to submit anything shorter
#   libpwquality minlen   the quality check rejects it
#   libpwquality minclass required two character classes, which a one character
#                         password cannot satisfy by definition
#   allowWeakPasswords    the master switch that permits a password failing the
#                         checks above
#
# The keys stay flush with the rest of the file. Indenting them by two made
# YAML read them as nested inside doAutologin, which has no value, and the whole
# module stopped parsing.
passwordRequirements:
    minLength: 1
    maxLength: 128
    libpwquality:
        - minlen=1
        - minclass=1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
    shell: /bin/bash
    forbidden_names: [ root, nobody ]
    home_permissions: "o755"

hostname:
    location: EtcFile
    writeHostsFile: true
    # Just "nyx", matching /etc/hostname in the base rootfs. It was "nyxlinux",
    # which made the installer offer a name that disagreed with the one the rest
    # of the image assumes, and the user has to retype the field every time.
    template: "nyx"
    forbidden_names: [ localhost ]
