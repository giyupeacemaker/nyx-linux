---
dontChroot: false
timeout: 300
verbose: true

i18n:
  name: "Preparing the package keyring"
  name[ru]: "Подготовка ключей пакетного менеджера"

script:
  # The target root filesystem is created by pacstrap, which installs
  # archlinux-keyring but never runs pacman-key --populate in it. The result is a
  # keyring that holds 183 keys and not one of them carries full or ultimate
  # trust: 149 have none, 15 are expired, 19 are revoked.
  #
  # /etc/pacman.conf asks for SigLevel = Required DatabaseOptional on core and
  # extra. Both databases are signed, DatabaseOptional means "if there is a
  # signature it must verify", and with no trusted key pacman has to refuse.
  # That refusal is the "pacman -Sy returned error code 1" that stopped every
  # installation, while the same pacman -Sy in the live session succeeded: there
  # the keyring lives on a writable tmpfs and gets populated on first use.
  #
  # This runs before the packages step for that reason. It is not a workaround
  # for a short mirrorlist or for blocked DNS: both were ruled out.
  - command: "pacman-key --init"
    timeout: 180
    verbose: true
  - command: "pacman-key --populate archlinux"
    timeout: 120
    verbose: true

  # Verify rather than assume. A keyring that is still untrusted would send us
  # straight back to the same failure, and a step that cannot tell the difference
  # between working and not working is not a step.
  - command: >-
      keys=/etc/pacman.d/gnupg;
      total=$(gpg --homedir $keys --list-keys --with-colons 2>/dev/null | grep -c '^pub' || true);
      trusted=$(gpg --homedir $keys --list-keys --with-colons 2>/dev/null |
      awk -F: '/^pub/ && ($2=="f" || $2=="u")' | wc -l);
      echo "keyring: $total keys, $trusted trusted";
      if [ "$trusted" -gt 0 ]; then
          echo "keyring is populated, package signatures will be verified";
      else
          echo "WARNING: still no trusted key after populate." >&2;
          echo "WARNING: relaxing SigLevel for core and extra so the install can" >&2;
          echo "WARNING: finish. Package signatures will NOT be verified." >&2;
          sed -i 's/^SigLevel = Required DatabaseOptional$/SigLevel = Optional TrustAll/' /etc/pacman.conf;
          echo "WARNING: SigLevel is now Optional TrustAll in the installed" >&2;
          echo "WARNING: system. Run pacman-key --populate archlinux once online" >&2;
          echo "WARNING: to restore signature checking." >&2;
      fi
    timeout: 120
    verbose: true
