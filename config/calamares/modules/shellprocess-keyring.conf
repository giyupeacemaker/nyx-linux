---
dontChroot: false
timeout: 300
verbose: true

i18n:
  name: "Preparing the package keyring"
  name[ru]: "Подготовка ключей пакетного менеджера"

script:
  # The whole command lives in /usr/local/sbin/nyx-prepare-keyring, not here.
  # shellprocess substitutes variables in the command string and treats every
  # dollar sign as a variable name, so the first version of this module died at
  # install time with "Missing variables are: keys,keys,2,2,total,trusted,
  # trusted" — the 2,2 came from awk's $2. A file has no such problem, and the
  # script is readable and testable on its own.
  #
  # What it does and why it is needed is documented in the script itself.
  - command: "nyx-prepare-keyring"
    timeout: 300
    verbose: true
