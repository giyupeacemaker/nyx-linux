---
dontChroot: false
timeout: 120
verbose: true

i18n:
  name: "Enabling the graphical login"
  name[ru]: "Включение графического входа"

script:
  # The whole command lives in /usr/local/sbin/nyx-enable-display-manager, not
  # here. shellprocess substitutes variables in the command string and treats
  # every dollar sign as a variable name, so anything with a $ in it dies at
  # install time. A file has no such problem.
  #
  # What it does and why it is needed is documented in the script itself.
  - command: "nyx-enable-display-manager"
    timeout: 120
    verbose: true
