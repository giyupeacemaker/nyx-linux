---
mode: required
method: packages
default: kde

labels:
  step: "Desktop environment / Window Manager"
  step[ru]: "Среда / оконный менеджер"

items:
  - id: kde
    name: "KDE Plasma"
    name[ru]: "KDE Plasma"
    description: "Feature-rich KDE Plasma with Dolphin, Konsole, Kate and Octopi."
    description[ru]: "KDE Plasma с Dolphin, Konsole, Kate и Octopi."
    screenshot: "/etc/calamares/branding/archlinux/desktop-kde.svg"
    packages:
      - plasma-desktop
      - plasma-workspace
      - plasma-x11-session
      - sddm
      - dolphin
      - konsole
      - kate
      - ark
      - gwenview
      - okular
      # Octopi, not Discover. Discover can only install applications through
      # Flatpak, and it is not in the CachyOS repository, so shipping it meant
      # shipping something whose only working half is a subsystem Nyx does not
      # have: without Flatpak it opens to a full-screen error telling the user
      # to install Flatpak, which is a bad first impression of the distribution.
      #
      # Octopi is a Qt front end to pacman itself. It reads /etc/pacman.conf, so
      # it installs from every repository this system actually has, CachyOS
      # included, and it needs no second package manager to exist first. It lives
      # in the CachyOS repository, and Qt is already present in this desktop, so
      # it costs the GTK-free, Flatpak-free arrangement nothing.
      - octopi
      - plasma-nm
      - polkit-kde-agent
      - xdg-desktop-portal-kde
      - xorg-server
      - xorg-xinit
      - xorg-apps

  - id: gnome
    name: "GNOME"
    name[ru]: "GNOME"
    description: "The GNOME desktop with GDM."
    description[ru]: "Графическая среда GNOME с менеджером входа GDM."
    screenshot: "/etc/calamares/branding/archlinux/desktop-gnome.svg"
    packages:
      - gnome
      - gdm
      - gnome-terminal
      - gnome-tweaks
      - nautilus
      - polkit-gnome
      - xdg-desktop-portal-gnome

  - id: xfce
    name: "XFCE"
    name[ru]: "XFCE"
    description: "A lightweight and fast desktop environment."
    description[ru]: "Лёгкая и быстрая графическая среда."
    screenshot: "/etc/calamares/branding/archlinux/desktop-xfce.svg"
    packages:
      - xfce4
      - lightdm
      - xfce4-terminal
      - thunar
      - mousepad
      - xarchiver
      - ristretto
      - polkit-gnome
      - xdg-desktop-portal-gtk

  - id: mate
    name: "MATE"
    name[ru]: "MATE"
    description: "A classic, familiar desktop with a traditional layout."
    description[ru]: "Классическая знакомая среда с традиционной компоновкой."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - mate-desktop
      - mate-control-center
      - mate-terminal
      - caja
      - mate-applets
      - mate-themes
      - mate-icon-theme
      - mate-polkit
      - lightdm
      - xdg-desktop-portal-gtk
      - xorg-server

  - id: cinnamon
    name: "Cinnamon"
    name[ru]: "Cinnamon"
    description: "A traditional desktop with modern effects and workflows."
    description[ru]: "Традиционная среда с современными эффектами и удобной работой."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - cinnamon
      - cinnamon-control-center
      - cinnamon-session
      - nemo
      - gnome-terminal
      - lightdm
      # A desktop with no polkit agent cannot ask for a password, so mounting a
      # disk, changing network settings and installing anything from a GUI all
      # fail silently or refuse outright. Cinnamon does not pull one in.
      - polkit-kde-agent
      - xdg-desktop-portal-xapp
      - xorg-server
      - xorg-xinit

  - id: budgie
    name: "Budgie"
    name[ru]: "Budgie"
    description: "A polished, modern desktop with a familiar panel."
    description[ru]: "Современная и аккуратная среда с привычной панелью."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - budgie-desktop
      - budgie-extras
      - nemo
      - gnome-terminal
      - gnome-control-center
      - lightdm
      # Budgie ships no polkit agent either. Same reason as Cinnamon above.
      - polkit-kde-agent
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
      - xorg-server

  - id: lxqt
    name: "LXQt"
    name[ru]: "LXQt"
    description: "A lightweight Qt desktop with a small footprint."
    description[ru]: "Лёгкая среда на Qt с небольшим потреблением ресурсов."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - lxqt-session
      - lxqt-panel
      - lxqt-config
      - lxqt-archiver
      - lxqt-sudo
      - lxqt-themes
      - qterminal
      - pcmanfm-qt
      - featherpad
      - xdg-desktop-portal-lxqt
      - qtxdg-tools
      - sddm
      - polkit-qt6

  - id: deepin
    name: "Deepin"
    name[ru]: "Deepin"
    description: "A polished desktop with a strong visual identity."
    description[ru]: "Отполированная среда с ярким визуальным стилем."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - deepin-session
      - deepin-shell
      - deepin-kwin
      - deepin-desktop-base
      - deepin-control-center
      - deepin-launchpad
      - deepin-terminal
      - deepin-file-manager
      - deepin-polkit-agent
      - xdg-desktop-portal-dde
      - lightdm
      - xorg-server

  - id: enlightenment
    name: "Enlightenment"
    name[ru]: "Enlightenment"
    description: "A classic graphical environment with a distinctive style."
    description[ru]: "Классическая графическая среда с характерным стилем."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - enlightenment
      - lightdm
      - pcmanfm
      - xterm
      # Enlightenment ships no polkit agent. No portal is listed here on
      # purpose, and this is the one desktop where that is a real limitation
      # rather than an oversight: the desktop runs on both X11 and Wayland, and
      # the portal has to match the session, xdg-desktop-portal-gtk for one and
      # xdg-desktop-portal-wlr for the other. Shipping one breaks the other
      # session. Whoever installs it has to pick the one for the session they
      # actually start, and the alternative of splitting this into two chooser
      # entries for the same desktop is worse.
      - polkit-kde-agent
      - xorg-server

  - id: pantheon
    name: "Pantheon"
    name[ru]: "Pantheon"
    description: "A smooth, curated desktop inspired by elementary OS."
    description[ru]: "Плавная и продуманная среда в духе elementary OS."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - pantheon-session
      - pantheon-wayland
      - pantheon-terminal
      - pantheon-files
      - switchboard
      - lightdm
      - lightdm-pantheon-greeter
      # Pantheon brings no polkit agent of its own.
      - polkit-kde-agent
      - xdg-desktop-portal-gtk

  - id: sway
    name: "Sway (tiling)"
    name[ru]: "Sway (тайлинг)"
    description: "A minimal Wayland tiling desktop with a compact toolkit."
    description[ru]: "Минимальный тайлинговый Wayland-стенд с компактным набором утилит."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - sway
      - swaybg
      - swaylock
      - waybar
      - wofi
      - mako
      - grim
      - slurp
      - foot
      - xdg-desktop-portal-wlr
      - polkit-kde-agent
      - sddm

  - id: hyprland
    name: "Hyprland (tiling)"
    name[ru]: "Hyprland (тайлинг)"
    description: "A dynamic Wayland tiling desktop with animation-friendly tooling."
    description[ru]: "Динамичный тайлинговый Wayland-стенд с инструментами и анимациями."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - hyprland
      - hyprpaper
      - hyprlock
      - waybar
      - wofi
      - mako
      - grim
      - slurp
      - foot
      - xdg-desktop-portal-hyprland
      - polkit-kde-agent
      - sddm

  # The pairs below are what a tiling setup is actually missing: a compositor
  # knows how to place windows and nothing else. Both shells here are quickshell
  # based and are released as separate builds per compositor, so choosing one
  # means choosing the variant built for the compositor it will run on. Listing
  # the plain "dms-shell" would install the desktop and leave the configuration
  # to be guessed at.
  #
  # waybar is not in these lists because each shell brings its own bar, and two
  # bars on one screen is not a feature. Everything else the base entries carry
  # is kept: a launcher, notifications, screenshots, a terminal, a lock screen,
  # a desktop portal, a polkit agent and a display manager. A system without a
  # polkit agent cannot ask for a password to mount a disk, and without a portal
  # a file chooser does not open at all.
  - id: hyprland-noctalia
    name: "Hyprland + Noctalia"
    name[ru]: "Hyprland + Noctalia"
    description: "Hyprland with the Noctalia shell: bar, launcher and notifications."
    description[ru]: "Hyprland с оболочкой Noctalia: панель, лаунчер и уведомления."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - hyprland
      - hyprpaper
      - hyprlock
      - noctalia
      - wofi
      - mako
      - grim
      - slurp
      - foot
      - xdg-desktop-portal-hyprland
      - polkit-kde-agent
      - sddm

  - id: hyprland-dms
    name: "Hyprland + DMS"
    name[ru]: "Hyprland + DMS"
    description: "Hyprland with the DMS shell, built for this compositor."
    description[ru]: "Hyprland с оболочкой DMS, собранной под этот композитор."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - hyprland
      - hyprpaper
      - hyprlock
      - dms-shell-hyprland
      - wofi
      - mako
      - grim
      - slurp
      - foot
      - xdg-desktop-portal-hyprland
      - polkit-kde-agent
      - sddm

  - id: niri
    name: "Niri (scrollable tiling)"
    name[ru]: "Niri (скролл-тайлинг)"
    description: "A scrollable-tiling Wayland compositor in Rust, with animated wallpapers."
    description[ru]: "Скролл-тайлинговый Wayland-композитор на Rust, с анимированными обоями."
    screenshot: "/etc/calamares/branding/archlinux/desktop-niri.svg"
    packages:
      - niri
      - waybar
      - mako
      - foot
      # Animated wallpaper daemon. Upstream swww was renamed to awww and moved
      # to Codeberg; Arch ships it as extra/awww, and the old name no longer
      # resolves.
      - awww
      - grim
      - slurp
      - xdg-desktop-portal-wlr
      - polkit-kde-agent
      - sddm

  # Niri paired with a shell, on the same reasoning as the Hyprland pairs above.
  # Niri ships with no bar of its own, so on its own it gives a usable desktop
  # and an unusable one at the same time.
  - id: niri-noctalia
    name: "Niri + Noctalia"
    name[ru]: "Niri + Noctalia"
    description: "Niri with the Noctalia shell: bar, launcher and notifications."
    description[ru]: "Niri с оболочкой Noctalia: панель, лаунчер и уведомления."
    screenshot: "/etc/calamares/branding/archlinux/desktop-niri.svg"
    packages:
      - niri
      - noctalia
      - mako
      - foot
      - awww
      - grim
      - slurp
      - xdg-desktop-portal-wlr
      - polkit-kde-agent
      - sddm

  - id: niri-dms
    name: "Niri + DMS"
    name[ru]: "Niri + DMS"
    description: "Niri with the DMS shell, built for this compositor."
    description[ru]: "Niri с оболочкой DMS, собранной под этот композитор."
    screenshot: "/etc/calamares/branding/archlinux/desktop-niri.svg"
    packages:
      - niri
      - dms-shell-niri
      - mako
      - foot
      - awww
      - grim
      - slurp
      - xdg-desktop-portal-wlr
      - polkit-kde-agent
      - sddm

  - id: i3
    name: "i3 (tiling)"
    name[ru]: "i3 (тайлинг)"
    description: "A tiny, fast X11 tiling window manager."
    description[ru]: "Маленький и быстрый тайлинговый оконный менеджер для X11."
    screenshot: "/etc/calamares/branding/archlinux/desktop-generic.svg"
    packages:
      - i3-wm
      - i3lock
      - i3status
      - dmenu
      - alacritty
      # i3 is a bare window manager and brings neither of these. The portal is
      # the GTK one because i3 here is X11; the wlr portal would be for a
      # Wayland compositor and is in every tiling entry that is one.
      - polkit-kde-agent
      - xdg-desktop-portal-gtk
      - sddm

  - id: minimal
    name: "Minimal system"
    name[ru]: "Минимальная система"
    description: "Install only the base system and selected utilities."
    description[ru]: "Установить только базовую систему и выбранные утилиты."
    screenshot: "/etc/calamares/branding/archlinux/desktop-minimal.svg"
    packages: []
